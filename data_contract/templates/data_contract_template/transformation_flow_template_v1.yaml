# Шаблон transformation_flow описывает массив шагов преобразования данных.
#
# ВАЖНО:
# 1. Шаги выполняются в том порядке, в котором они указаны в массиве, в зависимости от алгоритма.
# 2. Любая операция (read, filter, join, aggregate и т.д.) может применяться ПРОИЗВОЛЬНОЕ количество раз.
# 3. Шаги не привязаны к жесткой нумерации "1, 2, 3" — атрибут `step` выступает идентификатором 
#    или именем этапа (например, "read_clients", "filter_active").
# 4. Выборки полей (select), условия (predicates) и выражения (expressions) — это массивы, 
#    которые могут содержать любое необходимое количество элементов.
#
# Ниже представлена "палитра" шаблонов для всех возможных типов трансформаций.
# Для описания реальной витрины копируйте нужные блоки и комбинируйте их в нужном алгоритму порядке.

transformation_flow:

  # ==============================================================================
  # ПАТТЕРН: ЧТЕНИЕ ДАННЫХ (operation: "read")
  # Чтение из источника с возможным pushdown-фильтром и выборкой полей.
  # ==============================================================================
  - step: "<идентификатор_шага_например_read_source_A>"
    alias: "<alias_результирующего_датафрейма>"
    operation: "read"
    source: "<id_источника_из_sourceSystems>"
    description: "<Опционально: бизнес-смысл чтения>"
    filter:
      logic: "<Опционально: логика предварительной фильтрации>"
      predicates: 
        # Массив условий (будут объединены через AND)
        - "<условие_1>"
        - "<условие_N>"
    select:
      # Массив выбираемых полей
      - { targetColumn: "<целевое_имя_1>", logic: "<исходное_выражение_1>" }
      - { targetColumn: "<целевое_имя_N>", logic: "<исходное_выражение_N>" }

  # ==============================================================================
  # ПАТТЕРН: ФИЛЬТРАЦИЯ (operation: "filter")
  # Применение условий к уже существующему датафрейму.
  # ==============================================================================
  - step: "<идентификатор_шага_например_filter_active_only>"
    alias: "<alias_отфильтрованного_датафрейма>"
    operation: "filter"
    source: "<alias_входящего_датафрейма>"
    description: "<Опционально: описание логики фильтрации>"
    filter:
      logic: "<Опционально: бизнес-смысл>"
      predicates:
        # Массив условий для фильтрации
        - "<предикат_условия_1>"
        - "<предикат_условия_N>"

  # ==============================================================================
  # ПАТТЕРН: ДОБАВЛЕНИЕ/ИЗМЕНЕНИЕ ПОЛЕЙ (operation: "withColumn")
  # Создание вычисляемых полей или переопределение текущих (условная логика).
  # ==============================================================================
  - step: "<идентификатор_шага_например_enrich_status>"
    alias: "<alias_обогащенного_датафрейма>"
    operation: "withColumn"
    source: "<alias_входящего_датафрейма>"
    description: "<Опционально: описание условной логики>"
    expressions:
      # Массив создаваемых или переопределяемых полей
      - targetColumn: "<имя_поля_1>"
        logic: "<SQL_выражение_например_CASE_WHEN_или_COALESCE>"
        description: "<Опционально: смысл поля>"
      - targetColumn: "<имя_поля_N>"
        logic: "<SQL_выражение_N>"

  # ==============================================================================
  # ПАТТЕРН: ОБЪЕДИНЕНИЕ (operation: "join")
  # Объединение датафреймов с пре-фильтром правого источника и пост-фильтром результата.
  # ==============================================================================
  - step: "<идентификатор_шага_например_join_dict>"
    alias: "<alias_объединенного_датафрейма>"
    operation: "join"
    source: "<alias_левого_датафрейма>"
    description: "<Опционально: описание джойна>"
    join:
      left: "<alias_левого_датафрейма>"
      right: "<alias_правого_датафрейма>"
      type: "<inner | left | right | full | cross | semi | anti>"
      condition: "<SQL_условие_джойна>"
      preJoinFilter:
        logic: "<Опционально: фильтрация правой таблицы ДО объединения>"
        predicates: 
          # Массив условий для оптимизации джойна
          - "<предикат_на_правую_таблицу_1>"
          - "<предикат_на_правую_таблицу_N>"
    select:
      # Массив полей для выборки из результата объединения
      - { targetColumn: "*", logic: "<alias_левого_датафрейма>.*" }
      - { targetColumn: "<новое_поле_1>", logic: "<alias_правого_датафрейма>.<исходное_поле_1>" }
      - { targetColumn: "<новое_поле_N>", logic: "<alias_правого_датафрейма>.<исходное_поле_N>" }
    postJoinFilter:
      logic: "<Опционально: фильтрация результата ПОСЛЕ объединения>"
      predicates:
        # Массив условий
        - "<предикат_на_результат_1>"
        - "<предикат_на_результат_N>"

  # ==============================================================================
  # ПАТТЕРН: ОКОННЫЕ ФУНКЦИИ (operation: "window")
  # Аналитические вычисления в разрезе партиций.
  # ==============================================================================
  - step: "<идентификатор_шага_например_calc_ranks>"
    alias: "<alias_датафрейма_с_оконными_вычислениями>"
    operation: "window"
    source: "<alias_входящего_датафрейма>"
    description: "<Опционально: расчет рангов, нарастающих итогов>"
    expressions:
      # Массив оконных вычислений
      - targetColumn: "<имя_нового_поля_1>"
        logic: "<оконная_функция> OVER (PARTITION BY <поля> ORDER BY <поля>)"
      - targetColumn: "<имя_нового_поля_N>"
        logic: "<оконная_функция_N> OVER (PARTITION BY <поля>)"

  # ==============================================================================
  # ПАТТЕРН: АГРЕГАЦИЯ (operation: "aggregate")
  # Группировка данных (GROUP BY).
  # ==============================================================================
  - step: "<идентификатор_шага_например_group_by_client>"
    alias: "<alias_агрегированного_датафрейма>"
    operation: "aggregate"
    source: "<alias_входящего_датафрейма>"
    description: "<Опционально: описание агрегации>"
    groupBy:
      # Массив полей для группировки
      - "<поле_группировки_1>"
      - "<поле_группировки_N>"
    expressions:
      # Массив агрегирующих выражений
      - targetColumn: "<агрегат_1>"
        logic: "<агрегатная_функция_например_SUM_MAX>"
      - targetColumn: "<агрегат_N>"
        logic: "<агрегатная_функция_N>"

  # ==============================================================================
  # ПАТТЕРН: УДАЛЕНИЕ КОЛОНОК (operation: "drop")
  # Очистка датафрейма от промежуточных/технических полей.
  # ==============================================================================
  - step: "<идентификатор_шага_например_drop_temp_cols>"
    alias: "<alias_очищенного_датафрейма>"
    operation: "drop"
    source: "<alias_входящего_датафрейма>"
    description: "<Опционально: почему мы удаляем эти поля>"
    dropColumns:
      # Массив удаляемых полей
      - "<удаляемое_поле_1>"
      - "<удаляемое_поле_N>"

  # ==============================================================================
  # ПАТТЕРН: ВЫБОРКА / ПРОЕКЦИЯ (operation: "select")
  # Изменение структуры, финальное переименование или CAST типов.
  # ==============================================================================
  - step: "<идентификатор_шага_например_final_projection>"
    alias: "<alias_результирующего_датафрейма>"
    operation: "select"
    source: "<alias_входящего_датафрейма>"
    description: "<Опционально: финальная сборка и кастинг типов>"
    select:
      # Массив полей для финальной выборки
      - { targetColumn: "<целевое_имя_1>", logic: "CAST(<выражение_или_поле_1> AS <ТИП>)" }
      - { targetColumn: "<целевое_имя_N>", logic: "<выражение_или_поле_N>" }
