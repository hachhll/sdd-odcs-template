transformationFlow:
  - step: 1
    alias: "<source_alias_df>"
    operation: "read"
    source: "<source_alias_1>"
    filter:
      logic: "<Описание предварительной фильтрации источника>"
      predicates: 
        - "<source_alias_1>.<column> = <value>"
    select:
      - { targetColumn: "<col1>", logic: "<source_alias_1>.<col1>" }
      - { targetColumn: "<col2>", logic: "<source_alias_1>.<col2>" }

  - step: 2
    alias: "<joined_df>"
    operation: "join"
    source: "<source_alias_df>"
    join:
      left: "<source_alias_df>"
      right: "<source_alias_2>"
      type: "<inner | left | right>"
      condition: "<source_alias_df>.<id> = <source_alias_2>.<id>"
      preJoinFilter:
        logic: "<Описание префильтрации присоединяемой таблицы>"
        predicates: ["<source_alias_2>.is_deleted = false"]
    select:
      - { targetColumn: "*", logic: "<source_alias_df>.*" }
      - { targetColumn: "<new_col>", logic: "<source_alias_2>.<col>" }

  - step: 3
    alias: "final_df"
    operation: "aggregate"
    source: "<joined_df>"
    description: "<Описание логики агрегации или финального шага>"
    expressions:
      - targetColumn: "<agg_col>"
        logic: "max(<joined_df>.<col>) OVER (PARTITION BY <joined_df>.<id>)"
    select:
      - { targetColumn: "<final_col1>", logic: "<joined_df>.<col1>" }
      - { targetColumn: "last_update", logic: "now()", description: "Текущая метка времени" }
